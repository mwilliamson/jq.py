name: 'Setup msys2'
inputs:
  arch:
    required: true
runs:
  using: "composite"
  steps:
  - name: Set up MSYS2
    id: set-up-msys2
    uses: msys2/setup-msys2@v2
    with:
      msystem: ${{ inputs.arch == 'x86' && 'mingw32' || 'ucrt64' }}
      install: make mingw-w64-${{ inputs.arch == 'x86' && 'i686' || 'ucrt-x86_64' }}-gcc patch

  - name: Add MSYS2 toolchain to PATH
    shell: msys2 {0}
    run: echo "${{ steps.set-up-msys2.outputs.msys2-location }}/${MSYSTEM,,}/bin" >> "$GITHUB_PATH"

name: Build

on: [push, pull_request, workflow_dispatch]

env:
  FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')) }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15-intel]
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t", "pypy-3.11"]
        use-system-libs: [false]
        include:
          - os: ubuntu-22.04
            python-version: "3.11"
            use-system-libs: true

    steps:

    - uses: actions/checkout@v7

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - run: pip install tox virtualenv

    - run: tox -e py
      if: ${{ !matrix.use-system-libs }}

    - run: |
        # Remove deps to make sure they're not being used
        rm -r deps

        sudo apt-get install -y libjq-dev libonig-dev

        JQPY_USE_SYSTEM_LIBS=1 tox -e py
      if: ${{ matrix.use-system-libs }}

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        name: Use Python 3.11
        with:
          python-version: '3.11'

      - run: pip install build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels_matrix:
    name: Generate matrix for building wheels
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

      - uses: actions/checkout@v7

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # cibuildwheel 3.x builds everything up to 3.14 (incl. 3.8); 4.x is needed for 3.15 but dropped 3.8
      - id: set-matrix
        env:
          CIBW_ARCHS_LINUX: "auto aarch64"
          CIBW_ARCHS_MACOS: "auto"
          CIBW_ENABLE: "pypy"
          CIBW_SKIP: "pp*-win_amd64"
        run: |
          ids() {
            # $1 = cibuildwheel version, $2 = platform, $3 = grep filter
            pipx run --spec "cibuildwheel==$1" cibuildwheel --print-build-identifiers --platform "$2" | grep -E "$3" || true
          }
          MATRIX=$(
            {
              ids 3.3.0 linux . | sed 's/.*/{"cibw-only": "&", "os": "ubuntu-22.04", "cibw-version": "3.3.0"}/'
              ids 4.3.1 linux '^cp315' | sed 's/.*/{"cibw-only": "&", "os": "ubuntu-22.04", "cibw-version": "4.3.1"}/'
              ids 3.3.0 macos . | sed 's/.*/{"cibw-only": "&", "os": "macos-15-intel", "cibw-version": "3.3.0"}/'
              ids 4.3.1 macos '^cp315' | sed 's/.*/{"cibw-only": "&", "os": "macos-15-intel", "cibw-version": "4.3.1"}/'
              CIBW_ARCHS_WINDOWS=AMD64 ids 3.3.0 windows . | sed 's/.*/{"cibw-only": "&", "os": "windows-2022", "arch": "AMD64", "cibw-version": "3.3.0"}/'
              CIBW_ARCHS_WINDOWS=AMD64 ids 4.3.1 windows '^cp315' | sed 's/.*/{"cibw-only": "&", "os": "windows-2022", "arch": "AMD64", "cibw-version": "4.3.1"}/'
            } | jq --slurp --compact-output '{"include": .}'
          )
          echo matrix="$MATRIX" >> $GITHUB_OUTPUT

  build_wheels:
    name: Build ${{ matrix.cibw-only }} wheel

    needs: build_wheels_matrix

    strategy:
      matrix: ${{ fromJson(needs.build_wheels_matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:

    - name: Check whether to build wheel
      id: should-build-wheel
      if: |
        env.FULL_BUILD == 'true' ||
        matrix.cibw-only == 'cp310-manylinux_x86_64' ||
        matrix.cibw-only == 'cp314t-manylinux_x86_64' ||
        matrix.cibw-only == 'cp315t-manylinux_x86_64' ||
        matrix.cibw-only == 'pp311-manylinux_x86_64' ||
        matrix.cibw-only == 'cp310-musllinux_x86_64' ||
        matrix.cibw-only == 'cp310-macosx_x86_64' ||
        matrix.cibw-only == 'cp314t-macosx_x86_64' ||
        matrix.cibw-only == 'cp310-win_amd64' ||
        matrix.cibw-only == 'cp314t-win_amd64'
      shell: bash
      run: echo true=1 >> $GITHUB_OUTPUT

    - uses: actions/checkout@v7
      if: steps.should-build-wheel.outputs.true

    - name: Set up MSYS2
      if: steps.should-build-wheel.outputs.true && runner.os == 'Windows'
      uses: ./.github/actions/setup-msys2
      with:
        arch: ${{ matrix.arch }}

    - name: Set up QEMU
      if: steps.should-build-wheel.outputs.true && runner.os == 'Linux'
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all

    - name: Build wheels
      if: steps.should-build-wheel.outputs.true
      shell: bash
      run: pipx run --spec "cibuildwheel==${{ matrix.cibw-version }}" cibuildwheel --only "${{ matrix.cibw-only }}"
      env:
        CIBW_ENVIRONMENT: ${{ runner.os == 'Windows' && matrix.arch == 'x86' && 'CC=i686-w64-mingw32-gcc.exe' || '' }}

    - uses: actions/upload-artifact@v7
      if: steps.should-build-wheel.outputs.true
      with:
        name: dist-wheel-${{ matrix.cibw-only }}
        path: ./wheelhouse/*.whl

  build_wheels_macosx_arm64:
    name: Build macOS arm64 wheels
    runs-on: macos-15

    steps:

    - uses: actions/checkout@v7

    - name: Use Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Print build identifiers
      run: |
        python -m pip install cibuildwheel==3.3.0
        CIBW_SKIP=cp38-macosx_arm64 python -m cibuildwheel --print-build-identifiers

    - name: Build wheels
      if: ${{ env.FULL_BUILD == 'true' }}
      uses: pypa/cibuildwheel@v3.3.0
      env:
        CIBW_ENABLE: "pypy"
        CIBW_SKIP: cp38-macosx_arm64

    # cibuildwheel 4.x needed for 3.15
    - name: Build wheels (3.15)
      run: pipx run --spec cibuildwheel==4.3.1 cibuildwheel
      env:
        CIBW_BUILD: ${{ env.FULL_BUILD == 'true' && 'cp315-macosx_arm64 cp315t-macosx_arm64' || 'cp315t-macosx_arm64' }}

    - name: Build wheels
      if: ${{ env.FULL_BUILD != 'true' }}
      uses: pypa/cibuildwheel@v3.3.0
      with:
        only: cp310-macosx_arm64

    - uses: actions/upload-artifact@v7
      with:
        name: dist-wheels-macos-arm64
        path: ./wheelhouse/*.whl

  merge_dist_artifacts:
    runs-on: ubuntu-latest
    needs: [build_sdist, build_wheels, build_wheels_macosx_arm64]
    steps:
    - uses: actions/upload-artifact/merge@v7
      with:
        name: dist
        pattern: dist-*
